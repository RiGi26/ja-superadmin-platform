name: Core Stock source validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-stock-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://core-validation.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-validation-only
      SUPABASE_SERVICE_ROLE_KEY: synthetic-validation-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Load the immutable historical integration evidence
        run: |
          git fetch origin refs/tags/h1-hub-integration-evidence-20261015
          test "$(git rev-parse FETCH_HEAD^{commit})" = 265bdb507d92264a0abc8e640e683bafa363b13c
          git update-ref refs/heads/integrate/hub-inventory-owner-billing-static 265bdb507d92264a0abc8e640e683bafa363b13c
      - run: node --test lib/*.test.mjs
      - run: npx --no-install tsc --noEmit
      - run: npx --no-install eslint app/hub/workspace app/hub/signup app/hub/account app/hub/login app/hub/actions.ts app/hub/_public/PublicExploreNav.tsx app/hub/_public/PublicExploreContent.tsx app/auth/callback/route.ts lib/hub-registration.ts lib/hub-registration.test.mjs lib/hub-session.ts lib/hub-account.ts lib/hub-owned-workspace.ts lib/hub-owned-workspace.test.mjs lib/hub-signup-source-contract.mjs lib/hub-signup-source-contract.test.mjs lib/hub-e1-workspace.ts lib/e1-quarantine-release.ts lib/core-company.ts lib/core-registry-native.ts lib/e1-stock-binding.ts lib/registry-mutation-binding.ts lib/e1-realm.ts lib/hub-return-path.ts proxy.ts app/api/auth/e1/stock/quarantine/route.ts
      - run: npm run build
      - name: Check successor whitespace against the installed security baseline
        env:
          SOURCE_BASE_SHA: e92e74bb4536e8f7344c3c376fd02a1d35797756
        # Older SQL and patch evidence are immutable. Exact-byte tests cover that
        # history; this check covers every successor change, including CRLF pins.
        run: git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check "$SOURCE_BASE_SHA" HEAD
